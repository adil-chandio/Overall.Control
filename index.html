<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GEHRAI — A Deep Sea Cinematic</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
      .hidden { display: none !important; }

      /* Title screen */
      #title-screen { background: radial-gradient(ellipse at center, rgba(2,10,25,0.25) 0%, rgba(0,0,5,0.85) 100%); pointer-events: auto; transition: opacity 1.2s ease; }
      #title-screen.fade { opacity: 0; }
      #title-screen h1 { color: #cfe8ff; font-size: clamp(3rem, 10vw, 7rem); letter-spacing: 0.35em; font-weight: 200; text-shadow: 0 0 40px rgba(80,160,255,0.6); }
      #title-screen p { color: #7fa8cc; margin-top: 1rem; letter-spacing: 0.2em; font-size: clamp(0.7rem, 2vw, 1rem); text-transform: uppercase; }
      #start-btn { margin-top: 2.5rem; padding: 0.9rem 3rem; background: transparent; color: #cfe8ff; border: 1px solid rgba(140,190,255,0.6); border-radius: 999px; font-size: 1rem; letter-spacing: 0.25em; cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
      #start-btn:hover { background: rgba(100,170,255,0.15); box-shadow: 0 0 30px rgba(80,160,255,0.4); }

      /* HUD */
      #hud { justify-content: flex-end; padding-bottom: 4vh; }
      #caption { color: #eaf4ff; font-size: clamp(1rem, 3vw, 1.6rem); text-align: center; max-width: 80%; text-shadow: 0 2px 12px rgba(0,0,0,0.9); padding: 0.4rem 1.2rem; background: rgba(0,5,15,0.35); border-radius: 8px; opacity: 0; transition: opacity 0.4s; }
      #caption.show { opacity: 1; }
      #chapter-label { position: fixed; top: 3vh; left: 50%; transform: translateX(-50%); color: rgba(180,215,255,0.85); letter-spacing: 0.3em; font-size: clamp(0.65rem, 1.8vw, 0.95rem); text-transform: uppercase; text-shadow: 0 1px 8px #000; }

      #controls { position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); display: flex; gap: 0.6rem; z-index: 20; }
      #controls button { padding: 0.55rem 1.1rem; background: rgba(5,15,35,0.55); color: #bfe0ff; border: 1px solid rgba(120,180,255,0.35); border-radius: 999px; font-size: 0.8rem; letter-spacing: 0.1em; cursor: pointer; backdrop-filter: blur(6px); transition: all 0.2s; }
      #controls button:hover { background: rgba(60,120,200,0.35); }

      #badge { position: fixed; top: 3vh; right: 3vw; color: #ffd27f; border: 1px solid rgba(255,210,127,0.6); padding: 0.3rem 0.9rem; border-radius: 999px; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; text-shadow: 0 1px 6px #000; opacity: 0; transition: opacity 0.5s; z-index: 15; }
      #badge.show { opacity: 1; }

      /* End card */
      #end-card { background: radial-gradient(ellipse at center, rgba(2,10,25,0.4) 0%, rgba(0,0,5,0.92) 100%); pointer-events: auto; transition: opacity 1.5s; }
      #end-card h2 { color: #cfe8ff; font-size: clamp(2rem, 7vw, 4.5rem); letter-spacing: 0.3em; font-weight: 200; }
      #end-card p { color: #7fa8cc; margin: 1rem 0 2rem; letter-spacing: 0.15em; }
      #replay-btn { padding: 0.8rem 2.5rem; background: transparent; color: #cfe8ff; border: 1px solid rgba(140,190,255,0.6); border-radius: 999px; font-size: 0.95rem; letter-spacing: 0.25em; cursor: pointer; text-transform: uppercase; }
      #replay-btn:hover { background: rgba(100,170,255,0.15); }

      #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,5,0.55) 100%); }
      @media (max-width: 640px) {
        #chapter-label { top: auto; bottom: calc(3vh + 3.2rem); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>

    <div id="title-screen" class="overlay">
      <h1>GEHRAI</h1>
      <p>A Deep-Sea Cinematic &middot; 7 Chapters</p>
      <button id="start-btn">Begin the Dive</button>
    </div>

    <div id="chapter-label" class="hidden"></div>
    <div id="badge" class="hidden">Slow Motion</div>

    <div id="hud" class="overlay hidden">
      <div id="caption"></div>
    </div>

    <div id="controls" class="hidden">
      <button id="skip-btn">Skip ▸</button>
      <button id="lang-btn">UR | EN</button>
      <button id="mute-btn">🔊 Sound</button>
      <button id="cc-btn">CC: ON</button>
    </div>

    <div id="end-card" class="overlay hidden">
      <h2>THE ABYSS</h2>
      <p>1,099 meters below &middot; GEHRAI</p>
      <button id="replay-btn">Replay</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
